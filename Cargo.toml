[package]
name = "factory-sim"
version = "0.2.0"
edition = "2021"
description = "Discrete-event factory orchestration simulator: 25 mills, AGV fleet, tool crib, pallet magazine, scheduling with deadlock detection and fault injection"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
